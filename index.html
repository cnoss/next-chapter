<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#111111">
  <!-- Home screen app (iOS): full screen, status bar over the black header -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Next Chapter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Next Chapter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="app/icons/icon-192.png">
  <link rel="apple-touch-icon" href="app/icons/icon-180.png">
  <link rel="stylesheet" href="app/styles.css">
  <script>
    // Set before first paint so the app layout (tab bar) does not flicker.
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
      document.documentElement.classList.add('is-app');
    }
  </script>
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <p class="site-title"><a href="#/karten">Next Chapter</a></p>
      <p id="offline" class="offline-pill" hidden>Offline</p>
      <nav aria-label="Hauptnavigation" class="top-nav">
        <ul id="nav" class="nav"></ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <p>Einen Moment, die Stellen werden geladen.</p>
    <noscript><p>Für dieses Tool brauchst du JavaScript.</p></noscript>
  </main>

  <!-- Bottom tab bar, only visible in the home screen app -->
  <nav aria-label="App-Navigation" class="tabbar">
    <ul id="tabbar"></ul>
  </nav>

  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <h2 id="export-title">Bewertungen schicken</h2>
    <p>Deine Bewertungen sind bisher nur hier auf deinem Gerät. Schick sie an Papa, am Handy am einfachsten über „Teilen“ und dann Messenger oder Mail. Daraus wird die nächste Suche genauer.</p>
    <label for="export-text" class="visually-hidden">Bewertungen als Text</label>
    <textarea id="export-text" rows="10" readonly></textarea>
    <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
    <div class="form-actions">
      <button type="button" id="export-share" class="button button--primary" data-needs-text hidden>Teilen</button>
      <button type="button" id="export-copy" class="button" data-needs-text>Kopieren</button>
      <button type="button" id="export-download" class="button" data-needs-text>Herunterladen</button>
      <button type="button" id="export-close" class="button button--quiet">Schließen</button>
    </div>
  </dialog>
</body>
</html>
